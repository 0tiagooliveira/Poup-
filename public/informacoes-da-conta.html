<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="Poup+" href="icon/LogoPoup.svg">
    <title>Informações da Conta</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body class="background-verde">
    <div class="header-nova-conta">
        <div class="voltar" onclick="history.back()">
            <img src="icon/flecha-branca.svg" alt="Voltar">
            <span class="texto-branco">Voltar</span>
        </div>
        <h1 class="texto-branco">Informações da Conta</h1>
        <div class="saldo-atual">
            <span class="texto-branco">Saldo atual da conta</span>
            <span class="valor texto-branco">R$ 0,00</span>
        </div>
    </div>

    <!-- Container branco -->
    <div class="container-bancos">
        <div class="lista-bancos">
            <a href="selecao-de-banco.html" class="banco-item">
                <img id="banco-icone" src="" alt="Banco">
                <span id="banco-nome" class="texto-branco"></span>
            </a>
            <div class="banco-item descricao-item">
                <div class="descricao-header">
                    <img src="icon/descricao.svg" alt="Descrição">
                    <span class="texto-branco">Descrição</span>
                </div>
                <input type="text" id="descricao-input" placeholder="Escreva uma descrição" class="descricao-input">
            </div>
            <div class="banco-item" onclick="toggleTipoConta()">
                <img src="icon/duvida.svg" alt="Tipo de Conta" id="tipo-conta-icone">
                <span class="texto-branco" id="tipo-conta-texto">Tipo de Conta</span>
            </div>
            <div class="banco-item">
                <img src="icon/cor-da-conta.svg" alt="Cor da Conta">
                <span class="texto-branco">Cor da Conta</span>
            </div>
            <div class="banco-item">
                <img src="icon/duvida.svg" alt="Incluir na Soma">
                <span class="texto-branco">Incluir na soma da tela inicial</span>
            </div>
            <div class="banco-item">
                <img src="icon/duvida.svg" alt="Notificação">
                <span class="texto-branco">Notificação para adição rápida</span>
            </div>
        </div>
    </div>

    <!-- Contêiner de opções de tipo de conta -->
    <div id="tipo-conta-opcoes" class="container-opcoes" style="display: none;">
        <ul>
            <li onclick="selecionarTipoConta('Conta corrente', 'icon/conta-corrente-banco.svg')">
                <img src="icon/conta-corrente-banco.svg" alt="Conta corrente">
                Conta corrente
            </li>
            <li onclick="selecionarTipoConta('Carteira', 'icon/carteira.svg')">
                <img src="icon/carteira.svg" alt="Carteira">
                Carteira
            </li>
            <li onclick="selecionarTipoConta('Poupança', 'icon/poupança.svg')">
                <img src="icon/poupança.svg" alt="Poupança">
                Poupança
            </li>
            <li onclick="selecionarTipoConta('Investimentos', 'icon/investimentos.svg')">
                <img src="icon/investimentos.svg" alt="Investimentos">
                Investimentos
            </li>
            <li onclick="selecionarTipoConta('Outros...', 'icon/outros.svg')">
                <img src="icon/outros.svg" alt="Outros...">
                Outros...
            </li>
        </ul>
    </div>

    <!-- Barra de navegação -->
    <div class="barra-navegacao estilo-aba2">
        <ul class="flex-centro">
            <li class="home ativo" data-where="home">
                <a href="index.html">
                    <div class="icon-background">
                        <img src="icon/home.svg" alt="home">
                    </div>
                </a>
            </li>
            <li class="products" data-where="products">
                <div class="icon-background">
                    <img src="icon/Transações.svg" alt="Transações">
                </div>
            </li>
            <li class="services" data-where="services">
                <button class="botao-adicionar" onclick="toggleMenu()">
                    <div class="icon-background">
                        <img src="icon/+.svg" alt="Adicionar">
                    </div>
                </button>
            </li>
            <li class="about" data-where="about">
                <div class="icon-background">
                    <img src="icon/Planejamento.svg" alt="Planejamento">
                </div>
            </li>
            <li class="help" data-where="help">
                <div class="icon-background">
                    <img src="icon/mais.svg" alt="Mais">
                </div>
            </li>
        </ul>
    </div>

    <script src="info-conta.js"></script>
</body>
</html>
