<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="Poup+" href="icon/LogoPoup.svg">
    <title>Home</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body style="background-color: #FFFFFF;">
    <div class="container-arredondado">
        <!-- Ícone para editar perfil -->
        <div class="editar-perfil">
            <img src="icon/perfil.svg" alt="Editar Perfil">
        </div>

        <!-- Conteúdo da página -->
        <div class="conteudo">
            <!-- Lista de meses -->
            <div class="lista-meses">
                <button id="mes-atual" onclick="toggleListaMeses()">Janeiro</button>
                <div id="dropdown-meses" class="dropdown-conteudo">
                    <button onclick="selecionarMes('Janeiro')">Janeiro</button>
                    <button onclick="selecionarMes('Fevereiro')">Fevereiro</button>
                    <button onclick="selecionarMes('Março')">Março</button>
                    <button onclick="selecionarMes('Abril')">Abril</button>
                    <button onclick="selecionarMes('Maio')">Maio</button>
                    <button onclick="selecionarMes('Junho')">Junho</button>
                    <button onclick="selecionarMes('Julho')">Julho</button>
                    <button onclick="selecionarMes('Agosto')">Agosto</button>
                    <button onclick="selecionarMes('Setembro')">Setembro</button>
                    <button onclick="selecionarMes('Outubro')">Outubro</button>
                    <button onclick="selecionarMes('Novembro')">Novembro</button>
                    <button onclick="selecionarMes('Dezembro')">Dezembro</button>
                </div>
            </div>

            <!-- Saldo em contas -->
            <div class="saldo-contas">
                <span>Saldo em contas</span>
                <span class="valor-saldo">R$ 0,00</span>
                <button class="toggle-saldo">
                    <img src="icon/ver.svg" alt="Esconder Saldo">
                </button>
            </div>

            <!-- Receitas e Despesas -->
            <div class="receitas-despesas">
                <div class="receitas">
                    <img src="icon/receitas.svg" alt="Receitas">
                    <span>Receitas</span>
                    <span class="valor-receitas">R$ 0,00</span>
                </div>
                <div class="despesas">
                    <img src="icon/despesa.svg" alt="Despesas">
                    <span>Despesas</span>
                    <span class="valor-despesas">R$ 0,00</span>
                </div>
            </div>
        </div>
    </div>
    <h2 class="titulo-secao">Contas</h2>

    <!-- Seção Contas -->
    <div class="container container-contas">
        <!-- As contas serão inseridas aqui dinamicamente -->
    </div>

    <h2 class="titulo-secao">Cartão de crédito</h2>

    <!-- Seção Cartão de crédito -->
    <div class="container container-cartoes">
        <!-- Os cartões de crédito serão inseridos aqui dinamicamente -->
    </div>

    <h2 class="titulo-secao">Despesas por categoria</h2>

    <!-- Seção Despesas por categoria -->
    <div class="container">
        <div class="item">
            <div class="info info-despesas">
                <img src="icon/despesas.svg" alt="Despesas" class="icon-tamanho"><br>
                <p>Opa! Você não tem despesas cadastradas esse mês.</p>
            </div>
            <button class="btn-adicionar" onclick="adicionarCategoria()">Adicionar nova categoria</button>
        </div>
    </div>
    
    <!-- Barra de navegação -->
    <div class="barra-navegacao estilo-aba2">
        <ul class="flex-centro">
            <li class="home ativo" data-where="home">
                <a href="home.html">
                    <div class="icon-background">
                        <img src="icon/home.svg" alt="home">
                    </div>
                </a>
            </li>
            <li class="products" data-where="products">
                <div class="icon-background">
                    <img src="icon/Transações.svg" alt="Transações">
                </div>
            </li>
            <li class="services" data-where="services">
                <button class="botao-adicionar" onclick="toggleMenu()">
                    <div class="icon-background">
                        <img src="icon/+.svg" alt="Adicionar">
                    </div>
                </button>
            </li>
            <li class="about" data-where="about">
                <div class="icon-background">
                    <img src="icon/Planejamento.svg" alt="Planejamento">
                </div>
            </li>
            <li class="help" data-where="help">
                <div class="icon-background">
                    <img src="icon/mais.svg" alt="Mais">
                </div>
            </li>
        </ul>
    </div>

    <script src="home.js"></script>
</body>

</html>
